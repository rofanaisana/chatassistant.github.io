<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML 뷰어 — Chat Backup</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .viewer-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: calc(100vh - 57px);
      overflow: hidden;
    }
    .viewer-editor {
      background: #1e1e2e;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid #333;
    }
    .viewer-editor-header {
      padding: 0.5rem 1rem;
      background: #2a2a3e;
      color: #aaa;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }
    .viewer-editor-header i { color: #4A90D9; }
    #htmlInput {
      flex: 1;
      width: 100%;
      background: #1e1e2e;
      color: #cdd6f4;
      border: none;
      outline: none;
      font-family: 'Fira Code', 'Cascadia Code', 'Consolas', 'Monaco', monospace;
      font-size: 0.88rem;
      line-height: 1.7;
      padding: 1rem;
      resize: none;
      overflow-y: auto;
      tab-size: 2;
    }
    #htmlInput::-webkit-scrollbar { width: 6px; }
    #htmlInput::-webkit-scrollbar-track { background: #1e1e2e; }
    #htmlInput::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

    .viewer-preview {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
    }
    .viewer-preview-header {
      padding: 0.5rem 1rem;
      background: #f8f9fb;
      border-bottom: 1px solid #e8eaf0;
      color: #999;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }
    .viewer-preview-header i { color: #4A90D9; }
    .viewer-preview-header .save-btn {
      background: #4A90D9;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.25rem 0.7rem;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: background 0.15s;
      text-transform: none;
      letter-spacing: 0;
    }
    .viewer-preview-header .save-btn:first-of-type { margin-left: auto; }
    .viewer-preview-header .save-btn:hover:not(:disabled) { background: #3a7bc8; }
    .viewer-preview-header .save-btn:disabled { opacity: 0.5; cursor: default; }
    .viewer-preview-header .save-btn.ghost {
      background: #fff;
      color: #4A90D9;
      border: 1px solid #cfdcea;
    }
    .viewer-preview-header .save-btn.ghost:hover:not(:disabled) { background: #eef4fb; }

    /* 캡처 옵션 바 */
    .capture-bar {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      flex-wrap: wrap;
      padding: 0.4rem 1rem;
      background: #fbfcfe;
      border-bottom: 1px solid #e8eaf0;
      font-size: 0.72rem;
      color: #8a94a3;
      flex-shrink: 0;
    }
    .capture-bar label {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      white-space: nowrap;
    }
    .capture-bar select,
    .capture-bar input[type="number"] {
      border: 1px solid #dde3ec;
      border-radius: 4px;
      background: #fff;
      color: #4a5462;
      font-size: 0.72rem;
      padding: 0.15rem 0.3rem;
      font-family: inherit;
    }
    .capture-bar input[type="number"] { width: 3.4rem; }
    .capture-bar input[type="checkbox"] { accent-color: #4A90D9; margin: 0; }
    #captureStatus { margin-left: auto; color: #4A90D9; }
    #captureStatus[data-tone="warn"] { color: #d9704a; }

    #previewFrame {
      flex: 1;
      width: 100%;
      border: none;
      overflow: auto;
    }

    @media (max-width: 768px) {
      .viewer-layout {
        grid-template-columns: 1fr;
        position: relative;
      }
      .viewer-editor,
      .viewer-preview {
        position: absolute;
        inset: 0;
        height: 100%;
      }
      .viewer-preview { display: none; }
      .viewer-editor[data-hidden="true"] { display: none; }
      .viewer-preview:not([data-hidden]) { display: flex; }
      #captureStatus { width: 100%; margin-left: 0; }
    }
  </style>
</head>
<body class="split-page">
  <div class="page-wrapper">

    <header class="page-header">
      <a href="index.html" class="back-link">
        <i class="fa-solid fa-chevron-left"></i> 메인으로
      </a>
      <h1>🖥️ HTML 뷰어</h1>
    </header>

    <div class="mobile-tabs">
      <button class="mobile-tab-btn active" data-tab="editor" onclick="switchViewerTab('editor')">
        <i class="fa-solid fa-code"></i> 코드
      </button>
      <button class="mobile-tab-btn" data-tab="preview" onclick="switchViewerTab('preview')">
        <i class="fa-solid fa-eye"></i> 미리보기
      </button>
    </div>

    <div class="viewer-layout">

      <!-- Left: Code Editor -->
      <div class="viewer-editor" id="viewerEditorPanel">
        <div class="viewer-editor-header">
          <i class="fa-solid fa-code"></i> HTML 코드 입력
        </div>
        <textarea id="htmlInput" oninput="updatePreview()" placeholder="여기에 HTML 코드를 붙여넣으세요...

예시:
&lt;h1&gt;안녕하세요!&lt;/h1&gt;
&lt;p style=&quot;color:red;&quot;&gt;빨간 글씨&lt;/p&gt;"></textarea>
      </div>

      <!-- Right: Preview -->
      <div class="viewer-preview" id="viewerPreviewPanel">
        <div class="viewer-preview-header">
          <i class="fa-solid fa-eye"></i> 미리보기 (실시간)
          <button class="save-btn" id="savePngBtn" onclick="savePngImage()">
            <i class="fa-solid fa-image"></i> PNG 저장
          </button>
          <button class="save-btn ghost" id="saveGifBtn" onclick="saveGifImage()">
            <i class="fa-solid fa-film"></i> GIF 저장
          </button>
        </div>

        <div class="capture-bar">
          <label>배율
            <select id="captureScale">
              <option value="1">1x</option>
              <option value="2" selected>2x</option>
              <option value="3">3x</option>
            </select>
          </label>
          <label><input type="checkbox" id="captureFull" checked> 전체 높이</label>
          <label><input type="checkbox" id="useProxy" checked> 외부 이미지 프록시</label>
          <label><input type="checkbox" id="embedFonts" checked> 웹폰트 포함</label>
          <label>fps <input type="number" id="gifFps" value="15" min="2" max="30" step="1"></label>
          <label>최대 초 <input type="number" id="gifSecs" value="3" min="0.2" max="15" step="0.1"></label>
          <span id="captureStatus"></span>
        </div>

        <!-- allow-same-origin이 있어야 부모에서 이 안을 캡처할 수 있다 -->
        <iframe id="previewFrame" sandbox="allow-scripts allow-same-origin"></iframe>
      </div>

    </div>
  </div>

  <script src="js/capture.js"></script>
  <script>
    const htmlInput = document.getElementById('htmlInput');
    const previewFrame = document.getElementById('previewFrame');
    let previewTimer = null;

    // 키 입력마다 iframe을 다시 로드하면 무거우므로 살짝 늦춘다
    function updatePreview() {
      clearTimeout(previewTimer);
      previewTimer = setTimeout(() => {
        previewFrame.srcdoc = htmlInput.value;
      }, 200);
    }

    function switchViewerTab(tab) {
      const editor = document.getElementById('viewerEditorPanel');
      const preview = document.getElementById('viewerPreviewPanel');

      document.querySelectorAll('.mobile-tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelector(`[data-tab="${tab}"]`).classList.add('active');

      if (tab === 'editor') {
        editor.removeAttribute('data-hidden');
        preview.setAttribute('data-hidden', 'true');
      } else {
        editor.setAttribute('data-hidden', 'true');
        preview.removeAttribute('data-hidden');
      }
    }

    updatePreview();
  </script>
</body>
</html>
